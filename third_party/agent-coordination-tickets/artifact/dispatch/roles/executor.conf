# Built-in defaults for the executor role (lowest priority).
# Override any key in the sidecar or diag as 'executor.KEY=VALUE'.
access=read-write
rules=executor.md
prompt=executor.prompt
fix_prompt=executor-fix.prompt
evidence_prompt=executor-evidence.prompt
max_turns=80
timeout=0
# Review rounds before the job is reported as FAILURE.
rounds=3
# A STATUS: SUCCESS with HEAD unchanged is not done.
require_commit=yes
# A tag that must point at HEAD for the job to count as done (e.g. builds). Empty = no check.
done_tag=
# Reply verbs (must exist in the diag with a message block).
reply.complete=COMPLETE
reply.failure=FAILURE
reply.blocked=BLOCKED
reply.stopped=STOPPED
# Default review registry: one blocking plan-conformance review.
review.conformance.role=reviewer
review.conformance.blocking=yes
review.conformance.mode=in-process
