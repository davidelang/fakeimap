name = "agent-coordination-tickets"
git_https = "https://github.com/davidelang/agent-coordination-tickets.git"
git_ssh = "git@github.com:davidelang/agent-coordination-tickets.git"
git_sha = "0023bd143a52101fe577b86d5fe4f742c77d2b36"
git_describe = "0023bd1"
track_branch = "master"
reproducible = true
build_time = "minutes"
requires_writable_src = false
# GOCACHE and GOTMPDIR (go build's work dir) in src/build, the pin's writable build scratch, never /tmp; removed after the build.
build = ["mkdir -p src/build && d=$(mktemp -d \"$PWD/src/build/gocache.XXXXXX\") && cd src/go && GOCACHE=$d GOTMPDIR=$d GOTOOLCHAIN=local CGO_ENABLED=0 GOPROXY=off go build -trimpath -buildvcs=false -ldflags '-s -w' -o channel . ; rc=$?; rm -rf \"$d\"; exit $rc"]
consumer_note = "Channel handoff tools. The built go/channel is committed as artifact/channel (multi-call: artifact/channel-{setup,arm,send,ping,status,rebind} are symlinks to it); agents run only those from the repo root and never need src/. src/bin/channel (POSIX sh) and src/bin/channel.py are alternative implementations of the same tool, kept in step by the connector tests; agents do not run them. Consumers do not rerun the connector's tests. artifact/dispatch/ holds the headless dispatcher (dispatch/dispatch plus its lib, backends, hooks and roles), copied unchanged from src/dispatch/."

[[artifact]]
# Static Go binary (CGO_ENABLED=0, -trimpath, -buildvcs=false: same bytes from any checkout): committed, so a new worktree needs no library checkout.
path = "artifact/channel"
from = "src/go/channel"
sha256 = "cc92785158aa4f74dc8d2f2ecf40ad385ba320356bafa41a7edb73ba231b81d9"

# dispatch/: the headless dispatcher (docs/dispatch.md upstream). Plain copies of source files, no build;
# they keep their layout under artifact/dispatch/ because dispatch/dispatch finds the rest from its own path.

